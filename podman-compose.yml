# ─────────────────────────────────────────────────────────────────────────────
# podman-compose.yml  –  Qdrant vector database for UEFA.Rag.Indexer
#
# Usage:
#   podman-compose up -d          # start Qdrant
#   podman-compose down           # stop Qdrant
#
# The console app (UEFA.Rag.Indexer) connects to Qdrant via localhost:6334
# ─────────────────────────────────────────────────────────────────────────────

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: uefa-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage: