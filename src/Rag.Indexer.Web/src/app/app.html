<div class="app-shell">
  <header class="toolbar">
    <span class="brand">Rag<span>.Indexer</span></span>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Search</a>
      <a routerLink="/index" routerLinkActive="active">Index</a>
      <a routerLink="/status" routerLinkActive="active">Status</a>
    </nav>
    <button
      mat-icon-button
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </header>
  <main class="content">
    <router-outlet />
  </main>
</div>
